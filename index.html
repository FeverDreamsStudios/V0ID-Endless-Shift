<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Replace "Your Server Name" with your exact server name -->
    <title>V0ID: Endless Shift - Official Discord Community</title>
    <meta name="description" content="Join the official Your Server Name Discord community. Connect, chat, share projects, and hang out with us!">
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: #161922;
            --accent-color: #5865f2;
            --accent-hover: #4752c4;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .server-icon {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background-color: var(--accent-color);
            margin: 0 auto 24px auto;
            object-fit: cover;
            border: 3px solid var(--accent-color);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        p {
            font-size: 0.95rem;
            line-color: 1.5;
            color: var(--text-muted);
            margin-bottom: 32px;
        }

        .btn-join {
            display: inline-block;
            width: 100%;
            background-color: var(--accent-color);
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            padding: 14px 24px;
            border-radius: 8px;
            text-decoration: none;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-join:hover {
            background-color: var(--accent-hover);
        }

        .btn-join:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 24px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Replace logo.png with your server icon URL -->
        <img class="server-icon" src="image_7.png" alt="Your Server Name Icon">
        
        <!-- Replace with your actual server name -->
        <h1>V0ID: Endless Shift</h1>
        
        <!-- Replace with a short description of what your server is about -->
        <p>The official Discord server for our community. Join us to hang out, share work, and get exclusive updates.</p>
        
        <!-- Replace the href with your permanent Discord invite link -->
        <a class="btn-join" href="https://discord.gg/qJzPVJwCET" target="_blank" rel="noopener noreferrer">
            Join Discord Community
        </a>

        <div class="footer">
            Official Discord Community Hub
        </div>
    </div>

</body>
</html>
